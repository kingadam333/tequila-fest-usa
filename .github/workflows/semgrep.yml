# Thor's code scan: Semgrep with free rule packs only. No Semgrep login, no
# Semgrep App token, no paid API. Template of record: docs/thor/semgrep-workflow.yml
# in adam-bossin-nextjs; each repo gets a copy at .github/workflows/semgrep.yml.
#
# It never fails a build: findings go to Thor, not to the merge gate.
#
# Where the result goes, and why twice:
#   1. GitHub code scanning (SARIF upload). Free on public repos; a private repo
#      needs GitHub Code Security, so this step is allowed to fail.
#   2. An artifact named `semgrep-sarif`, always. Thor reads it when code
#      scanning has nothing (lib/orion/capabilities/code-scan-parse.ts), so a
#      private repo is still scanned for free.
# A repo with neither reads as "not scanned" on Thor's coverage, never clean.
name: Semgrep

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Semgrep (open-source CLI, pinned)
        run: pipx install semgrep==1.182.1

      - name: Scan with the free rule packs
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --metrics=off \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/secrets \
            --exclude node_modules --exclude .next --exclude dist --exclude build \
            --sarif --output semgrep.sarif
          python3 -c "import json; r=json.load(open('semgrep.sarif'))['runs'][0]['results']; print(f'Semgrep: {len(r)} finding(s)')"

      - name: Keep the SARIF for Thor (free path)
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

      - name: Upload to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@bd01fe9e80db3cb1eb1368bd8f61d3eb5f43d1f4 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
